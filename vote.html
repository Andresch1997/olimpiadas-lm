<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactivo — Olimpiadas LM</title><style>:root{--p:#0B3D91;--a:#0F766E;--bg:#f8fafc;--t:#1f2937;--m:#6b7280}*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);margin:0;padding:16px;max-width:1280px;margin-inline:auto}h1{color:var(--p);margin-top:0}h2{color:var(--a);margin-top:1.5em;font-size:1.1em}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}input,textarea,select{width:100%;padding:12px;font-size:1em;border:2px solid #cbd5e1;border-radius:8px;font-family:inherit}button{background:var(--p);color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px;font-size:1em}button:disabled{background:#94a3b8}.muted{color:var(--m);font-size:.9em}.ok{color:#15803d;font-weight:bold}.err{color:#b91c1c;font-weight:bold}</style></head><body><h1 id="title">Votación</h1><p class="muted" id="sub">Cargando…</p><div class="card" id="vc"><h2>Tu voto</h2><div id="ow"></div><button id="b" onclick="send()" style="display:none">Enviar voto</button><p id="s"></p></div><div class="card"><h2>Resultados <span class="muted" id="c">(0)</span></h2><div id="res">Esperando…</div></div><style>.opt{display:block;width:100%;text-align:left;padding:14px;margin:6px 0;border:2px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer}.opt:hover{border-color:var(--p)}.opt.sel{background:var(--p);color:#fff;border-color:var(--p)}.bar{display:flex;align-items:center;gap:10px;margin:6px 0}.bar .l{flex:0 0 40%;font-weight:600}.bar .tr{flex:1;background:#e2e8f0;height:24px;border-radius:6px;overflow:hidden}.bar .fl{background:var(--a);height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;color:#fff;padding-right:8px;font-size:.85em;font-weight:bold;transition:width .4s}.sr{margin:14px 0;padding:10px;border:1px solid #e2e8f0;border-radius:8px}.sb{display:flex;gap:8px;margin-top:6px}.sb button{flex:1;background:#fff;color:var(--p);border:2px solid var(--p);font-size:1.1em;margin-top:0}.sb button.sel{background:var(--p);color:#fff}</style><script>const BACKEND_URL="https://script.google.com/macros/s/AKfycbyZnV7_9gzknJiSM_akRz1ARZ_2kvt0rP7Wh-Mm-k12W-iolPCQcIub25KBwLs5C6LvRw/exec";const ID=new URLSearchParams(location.search).get("id")||"menti_1_5";let sl=null,mv=null;async function load(){const r=await fetch(BACKEND_URL+"?action=config");const c=await r.json();sl=c.find(s=>s.id===ID)||{id:ID,type:"multichoice",title:"Pregunta",options:["A","B","C"]};title.textContent=sl.title;sub.textContent="id: "+ID+" · "+sl.type;if(sl.type==="multichoice")renderMC();else if(sl.type==="scales")renderSC();refresh();setInterval(refresh,4000);}function renderMC(){ow.innerHTML="";sl.options.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=(i+1)+") "+o;b.onclick=()=>{mv=i;document.querySelectorAll(".opt").forEach(el=>el.classList.remove("sel"));b.classList.add("sel");document.getElementById("b").style.display="inline-block";};ow.appendChild(b);});}function renderSC(){ow.innerHTML="";mv={};sl.items.forEach(it=>{const row=document.createElement("div");row.className="sr";row.innerHTML="<div><strong>"+it+"</strong></div>";const bts=document.createElement("div");bts.className="sb";for(let v=sl.min||1;v<=(sl.max||5);v++){const b=document.createElement("button");b.textContent=v;b.onclick=()=>{mv[it]=v;row.querySelectorAll("button").forEach(el=>el.classList.remove("sel"));b.classList.add("sel");check();};bts.appendChild(b);}row.appendChild(bts);ow.appendChild(row);});}function check(){const all=sl.items.every(i=>mv[i]!=null);document.getElementById("b").style.display=all?"inline-block":"none";}async function send(){if(mv===null)return;document.getElementById("b").disabled=true;try{await fetch(BACKEND_URL+"?action=vote",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({id:ID,value:mv})});s.textContent="✓ Voto enviado";s.className="ok";vc.style.opacity=".6";refresh();}catch(e){s.textContent="⚠ Red";s.className="err";document.getElementById("b").disabled=false;}}async function refresh(){try{const r=await fetch(BACKEND_URL+"?action=results&id="+encodeURIComponent(ID));const d=await r.json();c.textContent="("+d.count+")";if(!d.votes||!d.votes.length){res.textContent="Esperando…";return;}if(sl.type==="multichoice"){const ct=new Array(sl.options.length).fill(0);d.votes.forEach(v=>{const i=Number(v);if(!isNaN(i)&&ct[i]!=null)ct[i]++;});const mx=Math.max(...ct,1);res.innerHTML="";sl.options.forEach((o,i)=>{const p=(ct[i]/d.votes.length*100).toFixed(0);const bar=document.createElement("div");bar.className="bar";bar.innerHTML="<div class=l>"+o+"</div><div class=tr><div class=fl style=width:"+(ct[i]/mx*100).toFixed(0)+"%>"+ct[i]+" ("+p+"%)</div></div>";res.appendChild(bar);});}else{const sm={},ns={};sl.items.forEach(i=>{sm[i]=0;ns[i]=0;});d.votes.forEach(v=>{if(typeof v!=="object")return;Object.entries(v).forEach(([it,va])=>{if(sm[it]!=null){sm[it]+=Number(va);ns[it]++;}});});res.innerHTML="";sl.items.forEach(it=>{const av=ns[it]?sm[it]/ns[it]:0;const p=(av/(sl.max||5)*100).toFixed(0);const bar=document.createElement("div");bar.className="bar";bar.innerHTML="<div class=l>"+it+"</div><div class=tr><div class=fl style=width:"+p+"%>"+av.toFixed(2)+"</div></div>";res.appendChild(bar);});}}catch(e){}}load();</script></body></html>
