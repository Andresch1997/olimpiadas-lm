<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactivo — Olimpiadas LM</title><style>:root{--p:#0B3D91;--a:#0F766E;--bg:#f8fafc;--t:#1f2937;--m:#6b7280}*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);margin:0;padding:16px;max-width:1280px;margin-inline:auto}h1{color:var(--p);margin-top:0}h2{color:var(--a);margin-top:1.5em;font-size:1.1em}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}input,textarea,select{width:100%;padding:12px;font-size:1em;border:2px solid #cbd5e1;border-radius:8px;font-family:inherit}button{background:var(--p);color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px;font-size:1em}button:disabled{background:#94a3b8}.muted{color:var(--m);font-size:.9em}.ok{color:#15803d;font-weight:bold}.err{color:#b91c1c;font-weight:bold}</style></head><body><h1 id="title">Muro</h1><p class="muted" id="sub">Cargando…</p><div class="card"><h2>Publicar</h2><div style="display:grid;gap:8px;grid-template-columns:1fr 1fr"><input type="text" id="au" placeholder="Nombre/equipo"><select id="co"></select></div><textarea id="tx" rows="3" placeholder="Tu mensaje" style="margin-top:8px"></textarea><button onclick="pub()">Publicar</button><p id="s"></p></div><div class="card"><h2>Muro <span class="muted" id="c">(0)</span></h2><div id="wl" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px"></div></div><style>.col{flex:0 0 280px;background:#f1f5f9;border-radius:10px;padding:10px;min-height:200px}.col h3{margin:0 0 8px;color:#7C2D12;font-size:1em}.note{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}.note .a{font-size:.8em;color:var(--m)}.note .t{margin-top:4px}</style><script>const BACKEND_URL="https://script.google.com/macros/s/AKfycbyZnV7_9gzknJiSM_akRz1ARZ_2kvt0rP7Wh-Mm-k12W-iolPCQcIub25KBwLs5C6LvRw/exec";const ID=new URLSearchParams(location.search).get("id")||"padlet_aula";let sl=null;async function load(){const r=await fetch(BACKEND_URL+"?action=config");const c=await r.json();sl=c.find(s=>s.id===ID)||{id:ID,type:"wall",title:"Muro",columns:["General"]};title.textContent=sl.title;sub.textContent="id: "+ID;const se=document.getElementById("co");sl.columns.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;se.appendChild(o);});refresh();setInterval(refresh,5000);}async function pub(){const a=au.value.trim(),co=document.getElementById("co").value,t=tx.value.trim();if(!t){s.textContent="⚠";s.className="err";return;}try{await fetch(BACKEND_URL+"?action=post",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({id:ID,author:a||"Anónimo",text:"["+co+"] "+t})});tx.value="";s.textContent="✓";s.className="ok";refresh();}catch(e){s.textContent="⚠ Red";s.className="err";}}async function refresh(){try{const r=await fetch(BACKEND_URL+"?action=wall&id="+encodeURIComponent(ID));const d=await r.json();c.textContent="("+d.count+")";wl.innerHTML="";const bc={};sl.columns.forEach(x=>bc[x]=[]);d.messages.forEach(m=>{const mt=/^\[([^\]]+)\]\s*(.*)/.exec(m.text);const col=(mt&&bc[mt[1]]!=null)?mt[1]:sl.columns[0];const txt=mt?mt[2]:m.text;bc[col].push({...m,text:txt});});sl.columns.forEach(col=>{const d=document.createElement("div");d.className="col";d.innerHTML="<h3>"+col+" <span class=muted>("+bc[col].length+")</span></h3>";bc[col].forEach(n=>{const no=document.createElement("div");no.className="note";no.innerHTML="<div class=a>"+esc(n.author)+"</div><div class=t>"+esc(n.text)+"</div>";d.appendChild(no);});wl.appendChild(d);});}catch(e){}}function esc(s){const d=document.createElement("div");d.textContent=String(s);return d.innerHTML;}load();</script></body></html>
