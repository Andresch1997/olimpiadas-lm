<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactivo — Olimpiadas LM</title><style>:root{--p:#0B3D91;--a:#0F766E;--bg:#f8fafc;--t:#1f2937;--m:#6b7280}*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);margin:0;padding:16px;max-width:1280px;margin-inline:auto}h1{color:var(--p);margin-top:0}h2{color:var(--a);margin-top:1.5em;font-size:1.1em}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}input,textarea,select{width:100%;padding:12px;font-size:1em;border:2px solid #cbd5e1;border-radius:8px;font-family:inherit}button{background:var(--p);color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px;font-size:1em}button:disabled{background:#94a3b8}.muted{color:var(--m);font-size:.9em}.ok{color:#15803d;font-weight:bold}.err{color:#b91c1c;font-weight:bold}</style></head><body><h1>🎙 Lanzador del facilitador</h1><p class="muted">Lista de interactivos. Copia las URLs en el WhatsApp del aula.</p><h2>📊 Mentimeter (8)</h2><div id="me"></div><h2>📌 Padlet (3)</h2><div id="pa"></div><style>.it{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.it .me{flex:1;min-width:200px}.it h3{margin:0 0 4px;color:var(--p)}.it p{margin:0;color:var(--m);font-size:.9em}.ac{display:flex;gap:8px;flex-wrap:wrap}a.bn{display:inline-block;background:var(--p);color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:bold}a.bn.al{background:var(--a)}</style><script>const BACKEND_URL="https://script.google.com/macros/s/AKfycbyZnV7_9gzknJiSM_akRz1ARZ_2kvt0rP7Wh-Mm-k12W-iolPCQcIub25KBwLs5C6LvRw/exec";const here=location.origin+location.pathname.replace(/index\.html$/,"");const tp={wordcloud:"wordcloud.html",multichoice:"vote.html",scales:"vote.html",wall:"wall.html"};const lb={wordcloud:"Nube",multichoice:"Opción múltiple",scales:"Escalas",wall:"Muro"};(async()=>{const r=await fetch(BACKEND_URL+"?action=config");const c=await r.json();render("me",c.filter(s=>s.type!=="wall"));render("pa",c.filter(s=>s.type==="wall"));})();function render(tg,ls){const t=document.getElementById(tg);ls.forEach(s=>{const u=here+(tp[s.type]||"wordcloud.html")+"?id="+encodeURIComponent(s.id);const d=document.createElement("div");d.className="it";d.innerHTML='<div class="me"><h3>'+s.id+'</h3><p>'+s.title+' <span class=muted>· '+(lb[s.type]||s.type)+'</span></p></div><div class="ac"><a class=bn href="'+u+'" target=_blank>Abrir</a><a class="bn al" href="javascript:cp(\''+u+'\')">Copiar</a></div>';t.appendChild(d);});}function cp(u){navigator.clipboard.writeText(u).then(()=>alert("Copiado: "+u));}</script></body></html>
