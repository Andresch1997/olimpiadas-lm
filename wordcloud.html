<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactivo — Olimpiadas LM</title><style>:root{--p:#0B3D91;--a:#0F766E;--bg:#f8fafc;--t:#1f2937;--m:#6b7280}*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);margin:0;padding:16px;max-width:1280px;margin-inline:auto}h1{color:var(--p);margin-top:0}h2{color:var(--a);margin-top:1.5em;font-size:1.1em}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}input,textarea,select{width:100%;padding:12px;font-size:1em;border:2px solid #cbd5e1;border-radius:8px;font-family:inherit}button{background:var(--p);color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px;font-size:1em}button:disabled{background:#94a3b8}.muted{color:var(--m);font-size:.9em}.ok{color:#15803d;font-weight:bold}.err{color:#b91c1c;font-weight:bold}</style></head><body><h1 id="title">Nube de palabras</h1><p class="muted" id="sub">Cargando…</p><div class="card"><h2>Tu respuesta</h2><input type="text" id="w" maxlength="40" placeholder="Una palabra…"><button id="b" onclick="send()">Enviar</button><p id="s"></p></div><div class="card"><h2>Resultados <span class="muted" id="c">(0)</span></h2><div id="cl" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:24px 8px;min-height:140px;align-items:center">Esperando…</div></div><script>const BACKEND_URL="https://script.google.com/a/macros/ecci.edu.co/s/AKfycbyPs_ESrqMb3nAmwM4m4TK5uj7Hm9bF-tgsBW0BWwHP-Z5eyRx6AcYscHJuaEv4cfH0rw/exec";const ID=new URLSearchParams(location.search).get("id")||"menti_1_1";let sent=0,MX=3;async function load(){try{const r=await fetch(BACKEND_URL+"?action=config");const c=await r.json();const s=c.find(x=>x.id===ID);if(s){title.textContent=s.title;sub.textContent="id: "+ID;MX=s.maxWords||3;}}catch(e){}refresh();setInterval(refresh,4000);}async function send(){const v=w.value.trim().toLowerCase();if(!v){s.textContent="⚠";s.className="err";return;}if(sent>=MX){s.textContent="✓ Ya enviaste "+MX;s.className="ok";return;}b.disabled=true;try{await fetch(BACKEND_URL+"?action=vote",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({id:ID,value:v})});sent++;s.textContent="✓ Enviado ("+sent+"/"+MX+")";s.className="ok";w.value="";refresh();}catch(e){s.textContent="⚠ Red";s.className="err"}b.disabled=false;}async function refresh(){try{const r=await fetch(BACKEND_URL+"?action=results&id="+encodeURIComponent(ID));const d=await r.json();c.textContent="("+d.count+")";if(!d.votes||!d.votes.length){cl.textContent="Esperando…";return;}const ct={};d.votes.forEach(v=>{const k=String(v).toLowerCase();ct[k]=(ct[k]||0)+1;});const mx=Math.max(...Object.values(ct));cl.innerHTML="";Object.entries(ct).sort((a,b)=>b[1]-a[1]).forEach(([w,n])=>{const sp=document.createElement("span");sp.style.cssText="padding:4px 10px;background:#eff6ff;color:var(--p);border-radius:6px;font-size:"+(0.9+n/mx*2)+"em";sp.textContent=w+(n>1?" ×"+n:"");cl.appendChild(sp);});}catch(e){}}addEventListener("keypress",e=>{if(e.key==="Enter")send();});load();</script></body></html>
